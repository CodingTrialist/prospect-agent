name: Deploy web to GitHub Pages

on:
  push:
    branches: [claude/prospect-triage-app-cvnnn1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway; a half-applied
# Pages deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Export web build
        # base_path is "/<repo>" for a project site, "" for a user site, so the
        # same workflow works if this ever moves to a custom domain.
        env:
          EXPO_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export -p web

      - name: Prepare artifact
        run: |
          # Pages runs Jekyll by default, which drops directories starting with
          # an underscore — that would 404 the entire _expo/ bundle.
          touch dist/.nojekyll
          # Single-screen SPA: serve the app shell for unknown paths too.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
